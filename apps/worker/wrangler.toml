name = "trading-grand-prix"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[vars]
APP_ORIGIN = "https://trading-grand-prix.klekhaj.workers.dev"
ADMIN_DISPLAY_NAME = "Lekhaj"

[[d1_databases]]
binding = "DB"
database_name = "trading-grand-prix-db"
database_id = "c36c5419-1325-4e35-a673-fefd5c92fd3c"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "773843ac37a24327ba7da97239fbdfa3"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# 5 routine slots (Mon-Fri, UTC matches US EDT during DST).
# Equity snapshots piggyback on each slot via handleScheduled -> captureEquitySnapshots.
[triggers]
crons = [
  "15 13 * * 1-5",
  "35 13 * * 1-5",
  "30 15 * * 1-5",
  "0 18 * * 1-5",
  "45 19 * * 1-5"
]

[dev]
port = 8787
