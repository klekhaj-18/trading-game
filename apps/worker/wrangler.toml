name = "trading-grand-prix"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Workers Paid default is 10,000 subrequests/invocation since Feb 2026, but
# wrangler 3.x doesn't always pick up the new default. Setting explicitly so
# refresh + cron handlers can do the full universe in one shot.
[limits]
cpu_ms = 30000
subrequests = 10000

[observability]
enabled = true

[vars]
APP_ORIGIN = "https://trading-grand-prix.klekhaj.workers.dev"
ADMIN_DISPLAY_NAME = "Lekhaj"

[[d1_databases]]
binding = "DB"
database_name = "trading-grand-prix-db"
database_id = "c36c5419-1325-4e35-a673-fefd5c92fd3c"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "773843ac37a24327ba7da97239fbdfa3"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# 5 routine slots + 1 pre-premarket factor warm + 1 every-5min equity tick.
# Routine slots and the equity tick run Mon-Fri only (markets closed otherwise);
# the warm runs every day so weekend/Monday-morning routines see <24h-old factor
# data instead of falling back to the 09:15 inline rebuild. UTC aligned to US
# EDT during DST. 12:45 UTC (8:45 ET) warms the union universe; the */5 13-20
# tick captures equity-only snapshots every 5 min during market hours.
[triggers]
crons = [
  "45 12 * * *",
  "15 13 * * MON-FRI",
  "35 13 * * MON-FRI",
  "30 15 * * MON-FRI",
  "0 18 * * MON-FRI",
  "45 19 * * MON-FRI",
  "*/5 13-20 * * MON-FRI"
]

[dev]
port = 8787
